<div class="card h-100 shadow-sm"><div class="card-header fw-semibold">{{ trip.name }}</div><img src="assets/images/{{ trip.image }}" alt="trip thumbnail" class="card-img-top"><div class="card-body d-flex flex-column"><h6 class="card-subtitle mb-2 text-muted">{{ trip.resort }}</h6><p class="card-subtitle mt-2 mb-3 text-muted">{{ trip.length }} only {{ trip.perPerson | currency:'USD':'symbol' }} per person</p><p class="card-text" [innerHTML]="trip.description"></p><div class="mt-auto d-flex gap-2" *ngIf="isLoggedIn()"><button (click)="editTrip(trip)" class="btn btn-info">Edit Trip</button><button (click)="deleted.emit(trip.code)" class="btn btn-outline-danger">Delete</button></div></div></div>
