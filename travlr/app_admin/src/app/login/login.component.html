<div class="row justify-content-center"><div class="col-12 col-md-6 col-lg-5"><h2 class="mb-3">Admin Login</h2>
<form (ngSubmit)="onLoginSubmit()">
<div *ngIf="formError" class="alert alert-danger" role="alert">{{ formError }}</div>
<div class="mb-3"><label for="name" class="form-label">Name</label><input id="name" name="name" class="form-control" type="text" [(ngModel)]="credentials.name" placeholder="Enter name"></div>
<div class="mb-3"><label for="email" class="form-label">Email Address</label><input id="email" name="email" class="form-control" type="email" [(ngModel)]="credentials.email" placeholder="Enter email address" required></div>
<div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" name="password" class="form-control" type="password" [(ngModel)]="credentials.password" placeholder="Enter password" required></div>
<button class="btn btn-info" type="submit">Sign In</button>
</form></div></div>
