<div class="row justify-content-center"><div class="col-lg-7"><h2 class="text-center mb-3">Edit Trip</h2><form *ngIf="editForm" [formGroup]="editForm" (ngSubmit)="onSubmit()">
<div class="row g-3"><div class="col-md-6" *ngFor="let field of fields"><label class="form-label">{{field.label}}</label><input [type]="field.type" [formControlName]="field.name" class="form-control" [class.is-invalid]="submitted && f[field.name].errors"><div class="invalid-feedback">{{field.label}} is required</div></div></div>
<div class="mt-3"><label class="form-label">Description</label><textarea formControlName="description" rows="5" class="form-control" [class.is-invalid]="submitted && f['description'].errors"></textarea><div class="invalid-feedback">Description is required</div></div>
<div class="mt-4 d-flex gap-2"><button type="submit" class="btn btn-info">Save</button><button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button></div></form></div></div>
